# M0 uses BTreeMap and Vec for sorted output. Use rustc_hash when a map is
# first needed.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "Use rustc_hash::FxHashMap for better performance" },
    { path = "std::collections::HashSet", reason = "Use rustc_hash::FxHashSet for better performance" },
]

# Process spawning is allowed crate-wide in Cargo.toml, then denied again at
# the crate root in src/lib.rs, the same pattern as the fallow analysis
# crates. Two modules spawn a process, and each one carries a narrow expectation
# at its one call site: the workspace loader in src/workspace.rs runs
# `cargo metadata`, and src/mutation/process.rs runs cargo and the memory tools. fallow also bans `glob::glob`. This crate does not depend
# on the glob crate, so that entry does not apply.
#
# `MetadataCommand::exec` is in the list because it spawns `cargo` inside the
# cargo_metadata crate, where the `Command::new` entry cannot see it.
disallowed-methods = [
    # Every parse of workspace source runs on the sized stack of
    # `parse::parse_source`, so deep nesting cannot overflow the stack. This
    # entry is the Rust form of scripts/check-parse-sites.mjs in fallow.
    { path = "ra_ap_syntax::SourceFile::parse", reason = "Parse workspace source only through parse::parse_source, which limits the nesting and bounds the stack" },
    { path = "std::process::Command::new", reason = "Only the workspace loader and the mutation runner spawn a process; the deny is scoped by a crate-root attribute" },
    { path = "cargo_metadata::MetadataCommand::exec", reason = "Only the workspace loader spawns `cargo metadata`; the deny is scoped by a crate-root attribute" },
]

# Maximum nesting depth before clippy::excessive_nesting fires.
excessive-nesting-threshold = 7

# SIG unit size: functions over 100 lines are flagged.
too-many-lines-threshold = 100

# SIG unit interfacing.
too-many-arguments-threshold = 6

# SIG unit complexity.
cognitive-complexity-threshold = 25

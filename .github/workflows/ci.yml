name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny all permissions by default, grant per-job as needed
permissions: {}

# A newer run of a pull request cancels the older one. Every other run gets a
# group of its own and is never cancelled, so each main commit has a finished
# run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# fallow has a `changes` job that skips jobs when no input changed. This
# repository is small, so each job runs on each event.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check for uncommitted changes
        run: git diff --exit-code

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # The pedantic, nursery and restriction lints come from [lints] in Cargo.toml.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check for uncommitted changes
        run: git diff --exit-code

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The `windows` job below runs the tests on Windows.
        os: [ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # The `mutants` tests build a coverage map with these tools.
          components: llvm-tools
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # The `ci` profile is in .config/nextest.toml. nextest does not run
      # doctests, so the next step runs them.
      - name: Run tests
        run: cargo nextest run --profile ci --locked
      - name: Run doctests
        run: cargo test --doc --locked
      # src/parse.rs sizes the parse stack with other values in a release
      # build. This profile has the release optimization and no debug
      # assertions, so these tests check the release values on Linux and macOS.
      - name: Run the parse stack tests in a release-like build
        run: cargo test --profile ci-release --locked --lib -- parse::tests the_walk_of_a_deep_tree
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check for uncommitted changes
        run: git diff --exit-code

  # src/workspace.rs has `#[cfg(windows)]` code, so Clippy on Linux does not
  # see all of it. The same pattern as the `windows-rust` job in fallow.
  windows:
    name: Windows path handling
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest run --profile ci --locked
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-junit-windows
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Clippy platform-specific paths
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check for uncommitted changes
        run: git diff --exit-code

  # The `precise` feature adds rust-analyzer as a library. The default jobs do
  # not build it. `--precise` needs the standard library source and the
  # proc-macro server of the toolchain, which the `rustc` component ships.
  precise:
    name: Precise mode
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rust-src
          cache-key: precise
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets --locked --features precise -- -D warnings
      - name: Run the visibility tests
        run: cargo nextest run --profile ci --locked --features precise -E 'binary(visibility) | test(/precise/)'
      - name: Check for uncommitted changes
        run: git diff --exit-code

  # The crate package: the file list, a build of the package with the
  # `precise` feature, and `cargo publish --dry-run`. See
  # docs/release-procedure.md.
  package:
    name: Package
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check the package file list
        run: |
          cargo package --list --locked > package-list.txt
          node scripts/check-package.mjs < package-list.txt
      - name: Build the package with the precise feature
        run: cargo package --locked --features precise
      # `cargo publish --dry-run` refuses `publish = false`. The step removes
      # the line in this checkout only and restores it after the dry run.
      - name: Publish dry run
        run: |
          sed -i '/^publish = false$/d' Cargo.toml
          cargo publish --dry-run --locked --allow-dirty
          git checkout -- Cargo.toml
      - name: Check for uncommitted changes
        run: git diff --exit-code

  doc:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items
      - name: Check for uncommitted changes
        run: git diff --exit-code

  typos:
    name: Typos
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1
      - name: Hidden unicode
        run: python3 scripts/scan-hidden-unicode.py --mode committed
      - name: Hidden-unicode scanner self-test
        run: bash scripts/test-scan-hidden-unicode.sh
      - name: Merge-conflict markers
        run: sh scripts/check-conflict-markers.sh
      - name: Merge-conflict marker check self-test
        run: bash scripts/test-check-conflict-markers.sh

  # The same steps as the JS Lint job in fallow.
  scripts:
    name: JS Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A full clone: the file-size check reads base blobs of changed files,
      # and a blobless clone cannot fetch them without stored credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: oxlint
        run: npm run lint:js
      - name: oxfmt --check
        run: npm run fmt:js:check
      - name: Narrator comment guard
        run: node scripts/check-comment-quality.mjs --all
      - name: Script tests
        run: node --test scripts/*.test.mjs .github/scripts/*.test.mjs
      # Same rule as the file-size pre-commit step, against the merge base.
      # It is the last step and runs after a failed step, so a growth failure
      # hides no other result.
      - name: Large file growth
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-file-size.mjs --base "origin/$BASE_REF"

  audit:
    name: Security Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      # cargo audit reads only Cargo.lock, so the job needs no protocol checkout.
      - run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  shear:
    name: Unused Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-shear
      - run: cargo shear
      - name: Check for uncommitted changes
        run: git diff --exit-code

  zizmor:
    name: Actions Security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # Pin zizmor so a new release adding/strengthening an audit cannot redden
      # CI on main with no change here. Bump deliberately, together with fallow.
      # fallow passes `--config .github/zizmor.yml` for its release and
      # Dependabot workflows. This repository has no such workflow, and
      # zizmor 1.26.1 reports no finding here, so it needs no config file.
      - run: uvx zizmor@1.26.1 --min-confidence medium --format plain .github/ action.yml

  msrv:
    name: MSRV (1.98)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.98.0'
          cache-key: msrv
      # The minimum follows the parser crates, which require a recent compiler.
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # fallow checks only the packages that it publishes. This package has
      # `publish = false` until M4, so the check reads every package.
      - name: Verify crate MSRV metadata
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e --arg msrv "1.98" '
            [.packages[] | .rust_version]
            | length > 0 and all(. == $msrv)
          '
      - name: Check compilation
        run: cargo check --locked --offline
      - name: Check for uncommitted changes
        run: git diff --exit-code

  ci-ok:
    name: CI
    if: always()
    needs: [fmt, clippy, test, windows, package, doc, typos, scripts, audit, deny, shear, zizmor, msrv]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All checks passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          for result in $(echo "$results" | jq -r '.[]'); do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Job failed with result: $result"
              exit 1
            fi
          done

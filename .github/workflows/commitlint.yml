name: Commitlint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The title step reads the event payload. An edit of the title must start
    # a new run, because a re-run of a failed job keeps the old text.
    types: [opened, synchronize, reopened, edited]

permissions: {}

# Pull requests share one group per branch, so a new push or a title edit
# cancels the old run.
# A push to main gets one group per commit, so a main run is never cancelled or
# dropped while queued.
concurrency:
  group: commitlint-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# fallow also checks deferred work in the pull request description with
# check-pr-deferrals.mjs. That check reads the fallow issue tracker, so it
# does not apply here.
jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci --ignore-scripts

      - name: Lint pull request title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint -- --verbose

      # Every commit in a pull request needs a Signed-off-by line (DCO). A push
      # to main is a squash commit that GitHub writes, so only pull requests
      # are checked. Bot pull requests do not carry a sign-off.
      - name: Check DCO sign-off
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-dco.mjs

      - name: Lint commit messages
        if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # The merge ref's first parent can be newer than the event base.
            from="$PR_BASE_SHA"
            if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
              from='HEAD^1'
            fi
            npm run commitlint -- --from "$from" --to HEAD --verbose
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            npm run commitlint -- --last --verbose
          else
            npm run commitlint -- --from "$BEFORE_SHA" --to HEAD --verbose
          fi

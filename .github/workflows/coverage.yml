name: Coverage

# Runs on main only, to keep pull request jobs few.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushes to main share one group, so a newer run cancels the older one. Only
# the newest main commit needs a result. A manual run gets a group of its own.
concurrency:
  group: "coverage-${{ github.event_name == 'push' && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'push' }}"

permissions: {}

env:
  CARGO_TERM_COLOR: always

# fallow also has a `changes` job and a badge `publish` job. The badge needs
# a `badges` branch on the public repository, so it is not here yet. The
# coverage floor is higher than the floor of 92.0 in fallow.
jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The mutants CLI tests run `cargo nextest`, so the job needs it too.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked --lcov --output-path coverage/lcov.info

      - name: Compute coverage
        run: |
          COVERAGE=$(awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { hit += $2 }
            END { if (total > 0) printf "%.1f", (hit/total)*100; else print "0" }
          ' coverage/lcov.info)
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "Coverage: $COVERAGE%"
          echo "Line coverage: $COVERAGE%" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage floor
        # Hard gate. Raise the floor over time, never lower it. Local line
        # coverage at the time of this change: 98.1%.
        run: |
          FLOOR=95.0
          awk -v cov="$COVERAGE" -v floor="$FLOOR" 'BEGIN {
            if (cov + 0 < floor + 0) {
              printf "FAIL: coverage %.1f%% is below the floor of %.1f%%\n", cov, floor
              exit 1
            }
            printf "OK: coverage %.1f%% meets the floor of %.1f%%\n", cov, floor
          }'

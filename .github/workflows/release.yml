name: Release

# The owner starts a release by hand on main. The workflow never creates the
# tag or the GitHub release. It checks the release commit, builds, attests and
# signs the binaries, publishes the crate, and stores the complete asset set
# as the `release-assets` artifact. After `Release ready for signed tag`
# passes, the owner runs scripts/publish-github-release.mjs. That script
# creates the signed tag and the GitHub release. A run keeps the dry-run
# default unless the owner sets it to false. docs/release-procedure.md has the
# procedure.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, for example 0.2.0. A dry run can leave it empty.
        required: false
        default: ''
        type: string
      dry-run:
        description: Check the package and build the binaries, but publish nothing
        required: false
        default: true
        type: boolean

run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run == false) && format('Release v{0}', inputs.version) || format('Release dry run on {0}', github.ref_name) }}

# A release has the group `release`, so two releases never run at the same
# time. Each dry run has a group of its own, so a dry run never queues a
# release or cancels a release that waits.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run == false) && 'release' || format('release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

# Deny all permissions by default, grant per job as needed.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The one switch between a dry run and a release. Each publication job reads
  # it through the `publish` output of the `plan` job.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == false }}

jobs:
  plan:
    name: Plan and check the package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      # A full clone, so the context check can read the HEAD subject.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-plan
          save-if: 'false'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      # A release stops here when the ref is not main, when HEAD is not the
      # release commit `chore: release vX.Y.Z` on origin/main, when the version
      # is not the Cargo.toml version, or when the tag exists. A dry run
      # reports the same problems as warnings.
      - name: Check the release context
        id: mode
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          node scripts/verify-release-context.mjs --version "$VERSION_INPUT" --dry-run "$DRY_RUN"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "publish: ${PUBLISH}" >> "$GITHUB_STEP_SUMMARY"

      # The owner writes the release notes from the CHANGELOG section of the
      # version. A release stops when that section is not ready. A dry run
      # before the release commit has no such section, so it only warns.
      - name: Check the release metadata
        shell: bash
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            node scripts/verify-release-metadata.mjs --tag "v${VERSION}"
          elif ! node scripts/verify-release-metadata.mjs --tag "v${VERSION}"; then
            echo "::warning::The release metadata check failed. A release with this CHANGELOG stops here."
          fi

      - name: Check the manifest
        if: ${{ steps.mode.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # `publish = false` gives an empty list in the metadata.
          publish_field="$(cargo metadata --no-deps --format-version 1 --locked | jq -c '.packages[] | select(.name == "cargo-fallow") | .publish')"
          if [ "$publish_field" != "null" ]; then
            echo "::error::Cargo.toml still has 'publish = false'. Remove it in the release commit."
            exit 1
          fi

      - name: Show the CHANGELOG section
        shell: bash
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          if ! node scripts/release-notes.mjs "$VERSION" --allow-unreleased >> "$GITHUB_STEP_SUMMARY"; then
            echo "The CHANGELOG has no section for ${VERSION} yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the package file list
        shell: bash
        run: |
          set -euo pipefail
          cargo package --list --locked > package-list.txt
          node scripts/check-package.mjs < package-list.txt

      # `cargo publish --dry-run` refuses a package with `publish = false`. If
      # the line comes back, a dry run removes it in the checkout of this job
      # only. `--allow-dirty` accepts that one change. A release never edits
      # the manifest: the check above requires that the line is not there.
      - name: Publish dry run
        shell: bash
        env:
          PUBLISH_MODE: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_MODE" = "true" ]; then
            cargo publish --dry-run --locked
          else
            sed -i '/^publish = false$/d' Cargo.toml
            git diff --stat -- Cargo.toml
            cargo publish --dry-run --locked --allow-dirty
            git checkout -- Cargo.toml
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries link musl statically, so they run on each glibc
          # version. The crate has no C code, so the build needs no musl-gcc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A cache scope of its own. A cache from a pull request build must not
      # reach a release binary.
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-build-${{ matrix.target }}
          save-if: 'false'

      - name: Build the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package the binary and its checksum
        id: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          name="cargo-fallow-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/${TARGET}/release/cargo-fallow.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
            archive="${name}.zip"
          else
            cp "target/${TARGET}/release/cargo-fallow" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          cd dist
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/${{ steps.archive.outputs.archive }}
            dist/${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Each job below runs only for a release. Each job that holds a credential
  # runs in the `release` environment. Its deployment rule admits the branch
  # `main` only, so a copy of this workflow on another branch gets no OIDC
  # token that the crates.io trusted publisher accepts.
  attest:
    name: Attest build provenance
    needs: [plan, build]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # Each archive gets an Ed25519 signature, the same model as the fallow repo.
  # The Action installer checks the signature with the public key in
  # action/scripts/verify-signature.mjs. This job checks each new signature
  # with that key, so a wrong secret stops the release.
  sign:
    name: Sign the archives
    needs: [plan, build]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Sign and check each archive
        shell: bash
        env:
          ED25519_BINARY_SIGNING_PRIVATE_KEY: ${{ secrets.ED25519_BINARY_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::The build jobs gave no archive to sign"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            node .github/scripts/sign-binary.mjs "$archive" "${archive}.sig"
            node action/scripts/verify-signature.mjs "$archive" "${archive}.sig"
          done

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signatures
          path: dist/*.sig
          if-no-files-found: error
          retention-days: 7

  publish-crate:
    name: Publish to crates.io
    needs: [plan, build, attest, sign]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A cache scope of its own, so no other job can change the package.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish
          save-if: 'false'

      # Trusted publishing: crates.io trusts the OIDC token of this workflow in
      # the `release` environment and returns a token that expires soon.
      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify` skips the verify build. That build would run the build
      # scripts of each dependency with the token in the environment. The
      # `plan` job already ran the same verify build without a token.
      - name: Publish the crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          set -uo pipefail
          if out=$(cargo publish --locked --no-verify 2>&1); then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          # A run again after a partial failure finds the version published.
          if printf '%s' "$out" | grep -qiE 'cargo-fallow.* already exists on crates\.io index|version .* is already uploaded'; then
            echo "::notice::cargo-fallow is already published, skipping"
            exit 0
          fi
          exit 1

  # The complete flat asset set of the GitHub release, as one artifact. The
  # owner downloads it with scripts/publish-github-release.mjs.
  release-assets:
    name: Stage the release assets
    needs: [plan, publish-crate]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the release tag to stay absent
        shell: bash
        env:
          TAG_NAME: v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `--exit-code` exits with 2 when the tag is absent. `|| status=$?`
          # keeps `-e` from stopping the step on that exit code.
          status=0
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG_NAME}" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The tag ${TAG_NAME} exists. The owner creates it after this run."
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::Could not read the tag ${TAG_NAME} (git exit ${status})"
            exit 1
          fi

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Download the signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signatures
          path: release-assets

      # Five targets, each with an archive, a `.sha256` file and a `.sig`
      # file, plus one SHA256SUMS file.
      - name: Assemble the asset set
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          for archive in ./*.tar.gz ./*.zip; do
            for suffix in sha256 sig; do
              if [ ! -s "${archive}.${suffix}" ]; then
                echo "::error::${archive} has no .${suffix} file"
                exit 1
              fi
            done
          done
          expected=$(( 5 * 3 + 1 ))
          found="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "$found" -ne "$expected" ]; then
            echo "::error::The asset set has ${found} files, expected ${expected}"
            ls -l
            exit 1
          fi
          ls -l

      - name: Upload the asset set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release-ready:
    name: Release ready for signed tag
    needs: [plan, release-assets]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the release tag to stay absent
        shell: bash
        env:
          TAG_NAME: v${{ needs.plan.outputs.version }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `--exit-code` exits with 2 when the tag is absent. `|| status=$?`
          # keeps `-e` from stopping the step on that exit code.
          status=0
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG_NAME}" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The tag ${TAG_NAME} appeared before the release workflow completed"
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::Could not read the tag ${TAG_NAME} (git exit ${status})"
            exit 1
          fi
          {
            echo "The release is ready. The tag ${TAG_NAME} is still absent. Run:"
            echo
            echo '```bash'
            echo "node scripts/publish-github-release.mjs --run ${GITHUB_RUN_ID} --version ${VERSION} --title \"${TAG_NAME}: <summary>\" --notes <notes file>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

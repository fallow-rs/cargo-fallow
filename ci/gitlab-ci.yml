# cargo-fallow GitLab CI template
#
# Run the static checks of cargo-fallow on a Rust workspace. The job writes a
# GitLab code quality report, so the merge request widget shows the findings.
# With CARGO_FALLOW_COMMENT it also posts one merge request note with the
# markdown report, and updates that note on the next run. A clean run posts
# no first note.
#
# Usage: add to your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/fallow-rs/cargo-fallow/<ref>/ci/gitlab-ci.yml'
#
#   cargo-fallow:
#     extends: .cargo-fallow
#     variables:
#       CARGO_FALLOW_REF: "<ref>"
#
# Use the same <ref> in the include and in CARGO_FALLOW_REF: the job downloads
# its scripts from that ref. When you vendor this file and ci/scripts/ into
# your repository, the job uses the vendored scripts.
#
# Each variable is optional.
#
# Examples:
#
#   # The dependency check only, with a note on the merge request
#   cargo-fallow-deps:
#     extends: .cargo-fallow
#     variables:
#       CARGO_FALLOW_COMMAND: "deps"
#       CARGO_FALLOW_COMMENT: "true"
#
#   # Report the findings, but do not fail the pipeline
#   cargo-fallow:
#     extends: .cargo-fallow
#     variables:
#       CARGO_FALLOW_FAIL_ON_ISSUES: "false"

.cargo-fallow:
  image: rust:1
  variables:
    # The changed-file scope needs the base commit of the merge request.
    GIT_STRATEGY: "fetch"
    GIT_DEPTH: "0"
    # check, deps, files, visibility, boundaries, size, complexity or dupes.
    CARGO_FALLOW_COMMAND: "check"
    # More flags for the command, split on white space.
    CARGO_FALLOW_ARGS: ""
    # "true" fails the job when an enforced gate fails.
    CARGO_FALLOW_FAIL_ON_ISSUES: "true"
    # A ref for --changed-since. Empty uses the merge request base when
    # CARGO_FALLOW_AUTO_CHANGED_SINCE is "true".
    CARGO_FALLOW_CHANGED_SINCE: ""
    CARGO_FALLOW_AUTO_CHANGED_SINCE: "true"
    # "true" posts one merge request note, but a clean run posts no first
    # note. It needs GITLAB_TOKEN with the api
    # scope, as a masked CI/CD variable: CI_JOB_TOKEN cannot write notes.
    CARGO_FALLOW_COMMENT: "false"
    # The marker of the note. Give each job with a note its own key.
    CARGO_FALLOW_COMMENT_KEY: ""
    # cargo: `cargo install cargo-fallow` from crates.io. path: use the
    # cargo-fallow on the PATH.
    CARGO_FALLOW_INSTALL: "cargo"
    # The crates.io version for CARGO_FALLOW_INSTALL "cargo". Empty means the
    # newest version.
    CARGO_FALLOW_VERSION: ""
    # The ref of the scripts to download, when the repository has no
    # vendored copy in CARGO_FALLOW_SCRIPTS_DIR. Give the ref of the include.
    CARGO_FALLOW_REF: ""
    CARGO_FALLOW_SCRIPTS_DIR: "ci/scripts"
  # The installed binary stays in the cache between jobs.
  cache:
    key: cargo-fallow-install-${CARGO_FALLOW_VERSION}
    paths:
      - .cargo-fallow-install/
  # A job that sets its own before_script replaces this list. Then it must
  # install cargo-fallow and copy the scripts itself.
  before_script:
    - |
      if ! command -v jq > /dev/null 2>&1 || ! command -v curl > /dev/null 2>&1 || ! command -v bash > /dev/null 2>&1; then
        if command -v apt-get > /dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq bash curl jq > /dev/null
        elif command -v apk > /dev/null 2>&1; then
          apk add --no-cache bash curl jq > /dev/null
        else
          echo "ERROR: The job needs bash, curl and jq."
          exit 1
        fi
      fi
    - |
      case "$CARGO_FALLOW_INSTALL" in
        path)
          command -v cargo-fallow > /dev/null 2>&1 || { echo "ERROR: CARGO_FALLOW_INSTALL is path, but no cargo-fallow is on the PATH."; exit 1; }
          ;;
        cargo)
          CARGO_FALLOW_ROOT="${CI_PROJECT_DIR:-.}/.cargo-fallow-install"
          if [ -n "$CARGO_FALLOW_VERSION" ]; then
            # A cached binary of the pinned version needs no build.
            if ! "${CARGO_FALLOW_ROOT}/bin/cargo-fallow" --version 2> /dev/null | grep -qF " ${CARGO_FALLOW_VERSION}"; then
              cargo install --locked --force --root "$CARGO_FALLOW_ROOT" --version "$CARGO_FALLOW_VERSION" cargo-fallow
            fi
          else
            cargo install --locked --root "$CARGO_FALLOW_ROOT" cargo-fallow
          fi
          ;;
        *)
          echo "ERROR: Invalid CARGO_FALLOW_INSTALL: ${CARGO_FALLOW_INSTALL}. Use cargo or path."
          exit 1
          ;;
      esac
    - |
      CARGO_FALLOW_JOB_SCRIPTS="${CI_PROJECT_DIR:-.}/.cargo-fallow-scripts"
      mkdir -p "$CARGO_FALLOW_JOB_SCRIPTS"
      for script in run.sh comment.sh; do
        if [ -f "${CARGO_FALLOW_SCRIPTS_DIR}/${script}" ]; then
          cp "${CARGO_FALLOW_SCRIPTS_DIR}/${script}" "${CARGO_FALLOW_JOB_SCRIPTS}/${script}"
        elif [ -z "$CARGO_FALLOW_REF" ]; then
          echo "ERROR: Set CARGO_FALLOW_REF to the ref of the include, or vendor ci/scripts/ into the repository."
          exit 1
        else
          curl --silent --show-error --fail --retry 3 \
            "https://raw.githubusercontent.com/fallow-rs/cargo-fallow/${CARGO_FALLOW_REF}/ci/scripts/${script}" \
            -o "${CARGO_FALLOW_JOB_SCRIPTS}/${script}"
        fi
      done
  script:
    - export PATH="${CI_PROJECT_DIR:-.}/.cargo-fallow-install/bin:${PATH}"
    - CARGO_FALLOW_COMMENT_KEY="${CARGO_FALLOW_COMMENT_KEY:-$CARGO_FALLOW_COMMAND}" bash "${CI_PROJECT_DIR:-.}/.cargo-fallow-scripts/run.sh"
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
      - cargo-fallow-results.json
      - cargo-fallow-report.md
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

[package]
name = "cargo-fallow-precise"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental precise check of the undecided visibility findings, on rust-analyzer crates"

# This crate has its own lockfile and target folder. The default build of
# cargo-fallow does not depend on the `ra_ap_*` crates.
[workspace]

[dependencies]
anyhow = "1"
ra_ap_hir = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_paths = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_vfs = "=0.0.358"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
